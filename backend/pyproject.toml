[project]
name = "wx"
version = "0.1.0"
description = "wx.fi data baker: fetches open weather data and writes static JSON for the info-screen"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pillow>=11",
    "numpy>=2",
    "sgp4>=2.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wx = "wx.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wx*"]

[tool.setuptools.package-data]
wx = ["*.yaml", "*.json", "vendor/dvoacap/DVoaData/*.dat", "vendor/dvoacap/LICENSE", "vendor/dvoacap/NOTICE", "vendor/dvoacap/VENDORED.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
